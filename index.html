<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Atendimento</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>Central de Atendimento</h1><p id="connection" role="status">Aguardando autenticação</p></header><section id="login" class="card"><h2>Acesso corporativo</h2><button id="google">Entrar com Google</button></section><section id="panel" hidden><nav><button id="sound">Ativar som</button><button id="logout">Sair</button></nav><p id="profile"></p><section id="operator" class="card" hidden><h2>Solicitar atendimento</h2><label>Rota<input id="route" maxlength="120"></label><label>Turno<select id="shift"><option>AM</option><option>PM</option></select></label><button id="call">Chamar analista</button></section><div class="metrics" id="metrics"></div><h2>Fila de atendimento</h2><div id="queue"></div><h2>Histórico recente</h2><div id="history"></div></section><p id="message" role="alert"></p></main><script type="module" src="app.js"></script></body></html>
